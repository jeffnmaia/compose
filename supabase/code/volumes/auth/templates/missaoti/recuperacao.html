<!-- Claro de propósito, pelo motivo do Boletim Diário: o Gmail do Android inverte
     e-mail escuro e ignora o color-scheme. Paleta de src/features/mentor/resumo/email.ts. -->
<div style="background:#eef2f8;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#131a2e">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #dde4ee;border-radius:14px;padding:28px">
    <p style="margin:0 0 18px;font-size:13px;font-weight:700;color:#1f62c4">Missão TI</p>
    <h1 style="margin:0 0 10px;font-size:20px">Crie uma senha nova</h1>
    <p style="margin:0 0 22px;font-size:14px;line-height:1.5;color:#4d5a73">
      Recebemos um pedido para trocar a senha da conta {{ .Email }}. O link vale por uma hora e precisa ser aberto no mesmo navegador em que você pediu.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2f7be5;color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:12px 20px;border-radius:10px">Criar senha nova</a>
    <p style="margin:22px 0 0;font-size:12.5px;line-height:1.5;color:#7d8a9e">
      Não foi você? Ignore este e-mail: a senha atual continua valendo.
    </p>
  </div>
</div>
